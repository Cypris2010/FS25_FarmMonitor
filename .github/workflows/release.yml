name: Release

on:
  push:
    tags:
      - '[0-9]*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Update modDesc.xml version and commit
        run: |
          # Extract base (e.g. 0.3.0) and build number from suffix (e.g. -dev3 → 3, none → 0)
          TAG="${{ github.ref_name }}"
          BASE=$(echo "$TAG" | sed 's/-.*//')
          # Encode pre-release type into build number: alpha=10, beta=20, rc=30, dev=40
          SUFFIX=$(echo "$TAG" | sed -n 's/.*-\([a-z]*\)\([0-9]*\)$/\1 \2/p')
          PRE_TYPE=$(echo "$SUFFIX" | awk '{print $1}')
          PRE_NUM=$(echo "$SUFFIX"  | awk '{print $2}')
          PRE_NUM=${PRE_NUM:-0}
          case "$PRE_TYPE" in
            alpha) BASE_OFF=10 ;;
            beta)  BASE_OFF=20 ;;
            rc)    BASE_OFF=30 ;;
            dev)   BASE_OFF=40 ;;
            *)     BASE_OFF=0  ;;
          esac
          BUILD=$((BASE_OFF + PRE_NUM))
          VERSION="${BASE}.${BUILD}"
          sed -i "s|<version>.*</version>|<version>${VERSION}</version>|" FS25_FarmMonitor/modDesc.xml
          echo "Set modDesc version to ${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH=$(git branch -r --contains HEAD | grep -v HEAD | head -1 | sed 's|origin/||' | xargs)
          git add FS25_FarmMonitor/modDesc.xml
          git diff --cached --quiet && echo "modDesc already up to date, skipping commit" || (git commit -m "chore: set modDesc version to ${VERSION} [skip ci]" && git fetch origin ${BRANCH} && git rebase origin/${BRANCH} && git push origin HEAD:${BRANCH})

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build binaries
        run: |
          cd Server
          TAG="${{ github.ref_name }}"
          # -trimpath strips local build paths; -s -w drop the symbol table and
          # DWARF debug info for a smaller binary. Together they reduce the
          # surface that Windows Defender's ML heuristic flags as a false
          # positive (Wacatac.C!ml on unsigned Go binaries). Panic stack traces
          # stay readable — they rely on the runtime's pclntab, not on -s/-w.
          LDFLAGS="-s -w -X main.serverVersion=${TAG}"
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "${LDFLAGS}" -o farmmonitor-windows.exe .
          CGO_ENABLED=0 GOOS=darwin  GOARCH=amd64 go build -trimpath -ldflags "${LDFLAGS}" -o farmmonitor-macos-intel .
          CGO_ENABLED=0 GOOS=darwin  GOARCH=arm64 go build -trimpath -ldflags "${LDFLAGS}" -o farmmonitor-macos-apple .

      - name: Package mod files
        run: zip -j FS25_FarmMonitor.zip FS25_FarmMonitor/*

      - name: Extract tag annotation
        id: tag_body
        run: |
          # Only annotated tags have a type of "tag"; lightweight tags have type "commit"
          TAG_TYPE=$(git cat-file -t "${{ github.ref_name }}")
          if [ "$TAG_TYPE" = "tag" ]; then
            BODY=$(git tag -l --format='%(contents)' "${{ github.ref_name }}")
          else
            BODY=""
          fi
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-dev') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          body: ${{ steps.tag_body.outputs.body }}
          files: |
            Server/farmmonitor-windows.exe
            Server/farmmonitor-macos-intel
            Server/farmmonitor-macos-apple
            FS25_FarmMonitor.zip

      # Upload the published binaries to VirusTotal and append the per-file
      # analysis links to the release notes. Serves as evidence that the
      # Defender "Wacatac.C!ml" detection is a false positive (most engines
      # report clean). The scan finishes asynchronously; the permalink is
      # available immediately. Never fails the release on detections.
      - name: VirusTotal scan
        continue-on-error: true
        uses: crazy-max/ghaction-virustotal@v4
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          update_release_body: true
          files: |
            ./Server/farmmonitor-windows.exe
            ./Server/farmmonitor-macos-intel
            ./Server/farmmonitor-macos-apple
            ./FS25_FarmMonitor.zip
