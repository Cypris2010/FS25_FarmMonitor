name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build binaries
        run: |
          cd Server
          GOOS=windows GOARCH=amd64 go build -o farmmonitor-windows.exe .
          GOOS=darwin  GOARCH=amd64 go build -o farmmonitor-macos-intel .
          GOOS=darwin  GOARCH=arm64 go build -o farmmonitor-macos-apple .

      - name: Package mod files
        run: zip -j FS25_FarmMonitor.zip FS25_FarmMonitor/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            Server/farmmonitor-windows.exe
            Server/farmmonitor-macos-intel
            Server/farmmonitor-macos-apple
            FS25_FarmMonitor.zip
